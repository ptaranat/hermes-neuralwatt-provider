<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #081A17; --fg: #FDFCF7; --muted: #8FA39C; --line: #1E3530; --panel: #0C231F; --panel-fg: #FDFCF7; --panel-muted: #8FA39C; --panel-line: #2A4741;
  --orange: #D55934; --orange-light: #E8825C; --dot-off: #1E3530; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 600px; background: var(--bg); }
body { color: var(--fg); font-family: "Satoshi", sans-serif; display: grid; grid-template-columns: 1fr 460px; gap: 60px; padding: 72px 76px; overflow: hidden; position: relative; }
.left { display: flex; flex-direction: column; justify-content: center; }
.logo { width: 560px; height: auto; display: block; }
.for { font-size: 76px; font-weight: 500; color: var(--muted); letter-spacing: -.02em; margin-top: 18px; line-height: 1; }
.tag { font-size: 32px; font-weight: 500; line-height: 1.25; white-space: nowrap; }
.kicker { font-family: "DM Mono", monospace; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
.meter { align-self: center; background: var(--panel); color: var(--panel-fg); border: 1px solid var(--panel-line); border-radius: 4px; padding: 30px 34px; font-family: "DM Mono", monospace; }
.meter .head { display: flex; justify-content: space-between; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--panel-muted); padding-bottom: 14px; border-bottom: 1px solid var(--panel-line); }
.reading { display: flex; align-items: baseline; gap: 12px; margin-top: 20px; }
.reading b { font-family: "Satoshi", sans-serif; font-weight: 700; font-size: 118px; letter-spacing: -.04em; line-height: .9; color: var(--orange); }
.reading i { font-style: normal; font-family: "Satoshi", sans-serif; font-weight: 700; font-size: 44px; color: var(--orange); letter-spacing: -.02em; }
.sub { font-size: 18px; color: var(--panel-muted); margin-top: 10px; }
.free { margin-top: 26px; }
.free .row { display: flex; justify-content: space-between; font-size: 16px; color: var(--panel-fg); letter-spacing: .04em; }
.dots { display: flex; gap: 9px; margin-top: 12px; }
.dots i { width: 26px; height: 26px; border-radius: 50%; background: var(--orange); }
.dots i.half { background: var(--orange-light); opacity: .55; }
.dots i.off { background: var(--dot-off); }
.lines { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--panel-line); display: grid; gap: 8px; font-size: 16px; }
.lines div { display: flex; justify-content: space-between; }
.lines span:first-child { color: var(--panel-muted); text-transform: uppercase; letter-spacing: .1em; }
</style></head>
